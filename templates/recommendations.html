<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkGraph — Recommendations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/recommendations.css') }}">

 
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/">Link<span>Graph</span></a>

  <div class="nav-center">
    <a class="nav-link" href="/feed-page">Feed Ranking</a>
    <a class="nav-link" href="/connections-page">Connections</a>
    <a class="nav-link active" href="/recommendations-page">Recommendations</a>
    <a class="nav-link" href="/communities-page">Communities</a>
  </div>

  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <img class="nav-avatar" id="nav-avatar" src="" alt=""
         onerror="this.style.display='none'">
    <a href="/logout" class="signout">Sign out</a>
  </div>
</nav>


<div class="layout">

  <!-- LEFT: Main content -->
  <div>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <div class="page-title">Recommended for You</div>
        <div class="page-subtitle">Posts and people matched to your professional interests</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="section-tabs">
      <button class="section-tab active" onclick="switchTab('posts', this)">Recommended Posts</button>
      <button class="section-tab" onclick="switchTab('similar', this)">Similar Users</button>
      <button class="section-tab" onclick="switchTab('trending', this)">Trending Now</button>
    </div>

    <!-- Posts tab -->
    <div id="tab-posts">
      <div id="posts-container">
        <div class="post-card" style="opacity:1">
          <div class="post-header">
            <div class="skeleton-avatar"></div>
            <div style="flex:1">
              <div class="skeleton" style="width:55%"></div>
              <div class="skeleton" style="width:40%"></div>
            </div>
          </div>
          <div class="skeleton"></div>
          <div class="skeleton" style="width:80%"></div>
        </div>
        <div class="post-card" style="opacity:1">
          <div class="post-header">
            <div class="skeleton-avatar"></div>
            <div style="flex:1">
              <div class="skeleton" style="width:50%"></div>
              <div class="skeleton" style="width:38%"></div>
            </div>
          </div>
          <div class="skeleton"></div>
          <div class="skeleton" style="width:70%"></div>
        </div>
      </div>
    </div>

    <!-- Similar users tab -->
    <div id="tab-similar" style="display:none">
      <div id="similar-container"></div>
    </div>

    <!-- Trending tab -->
    <div id="tab-trending" style="display:none">
      <div id="trending-container"></div>
    </div>

  </div>


  <!-- RIGHT: Sidebar -->
  <aside>

    <!-- User switcher -->
    <div class="card">
      <div class="sidebar-section">
        <div id="user-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Your skills</div>
        <div class="my-skills" id="my-skills"></div>
      </div>
    </div>

  </aside>

</div>


<script>
  let allUsers      = [];
  let currentUserId = 1;
  let currentTab    = 'posts';

  async function init() {
    const res = await fetch('/users');
    allUsers  = await res.json();
    renderUserSwitcher(allUsers);
    await selectUser(1);

    const meRes = await fetch('/me');
    if (meRes.status === 401) { window.location.href = '/login'; return; }
    const me = await meRes.json();
    const navUser = document.getElementById('nav-user');
    const navAvatar = document.getElementById('nav-avatar');
    if (navUser) navUser.textContent = me.name.split(' ')[0];
    if (navAvatar) navAvatar.src = me.avatar;
  }

  function renderUserSwitcher(users) {
    const container = document.getElementById('user-list');
    container.innerHTML = users.map(u => `
      <button class="user-pill ${u.id === currentUserId ? 'active' : ''}"
              id="pill-${u.id}" onclick="selectUser(${u.id})">
        <img src="${u.avatar}" alt="${u.name}"
             onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0077B5&color=fff&size=64'">
        <div>
          <div class="pill-name">${u.name}</div>
          <div class="pill-company">${u.company}</div>
        </div>
      </button>
    `).join('');
  }

  async function selectUser(userId) {
    currentUserId = userId;

    document.querySelectorAll('.user-pill').forEach(p => p.classList.remove('active'));
    const pill = document.getElementById(`pill-${userId}`);
    if (pill) pill.classList.add('active');

    // show skills
    const user = allUsers.find(u => u.id === userId);
    if (user) {
      document.getElementById('my-skills').innerHTML =
        user.skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
    }

    await loadCurrentTab();
  }

  function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('tab-posts').style.display    = tab === 'posts'    ? 'block' : 'none';
    document.getElementById('tab-similar').style.display  = tab === 'similar'  ? 'block' : 'none';
    document.getElementById('tab-trending').style.display = tab === 'trending' ? 'block' : 'none';

    loadCurrentTab();
  }

  async function loadCurrentTab() {
    if (currentTab === 'posts')    await loadRecommendations();
    if (currentTab === 'similar')  await loadSimilarUsers();
    if (currentTab === 'trending') await loadTrending();
  }

  // ── Recommended posts ──────────────────────────────────
  async function loadRecommendations() {
    const container = document.getElementById('posts-container');
    container.innerHTML = skeletonPost() + skeletonPost();

    const res = await fetch('/recommendations');
    const posts = await res.json();

    if (!posts.length) {
      container.innerHTML = '<div class="empty-state">No recommendations found for this user.</div>';
      return;
    }

    container.innerHTML = '';
    posts.forEach((post, index) => {
      const delay  = index * 70;
      const source = post.source === 'personalised' ? 'personalised' : 'trending';

      const el = document.createElement('div');
      el.className = 'post-card';
      el.style.animationDelay = `${delay}ms`;
      el.innerHTML = `
        <div class="post-header">
          <img class="post-avatar"
               src="${post.author_avatar}"
               alt="${post.author_name}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.author_name)}&background=0077B5&color=fff&size=92'">
          <div>
            <div class="author-name">${post.author_name}</div>
            <div class="author-headline">${post.author_headline}</div>
            <div class="post-time">${post.timestamp}</div>
          </div>
        </div>

        <p class="post-content">${post.content}</p>

        ${post.recommendation_reason ? `
        <div class="recommendation-reason">${post.recommendation_reason}</div>` : ''}

        <div class="post-tags">
          ${(post.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}
        </div>

        <div class="post-stats">
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
            ${post.likes}
          </span>
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
            ${post.comments}
          </span>
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            ${post.shares}
          </span>
        </div>
      `;
      container.appendChild(el);
    });
  }

  // ── Similar users ──────────────────────────────────────
  async function loadSimilarUsers() {
    const container = document.getElementById('similar-container');
    container.innerHTML = '<div class="post-card" style="opacity:1"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:40%"></div></div>';

    const res = await fetch('/similar');
    const users = await res.json();

    if (!users.length) {
      container.innerHTML = '<div class="empty-state">No similar users found.</div>';
      return;
    }

    container.innerHTML = '';
    users.forEach((user, index) => {
      const delay    = index * 70;

      const currentUser   = allUsers.find(u => u.id === currentUserId);
      const currentSkills = new Set(currentUser ? currentUser.skills : []);
      const sharedSkills  = user.shared_skills || (user.skills || []).filter(s => currentSkills.has(s));

      const el = document.createElement('div');
      el.className = 'similar-card';
      el.style.animationDelay = `${delay}ms`;
      el.innerHTML = `
        <img class="similar-avatar"
             src="${user.avatar}"
             alt="${user.name}"
             onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=7B2D8B&color=fff&size=104'">
        <div class="similar-info">
          <div class="similar-name">${user.name}</div>
          <div class="similar-headline">${user.headline}</div>
          <div class="shared-skills">
            ${sharedSkills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
          </div>
          ${user.recommendation_reason ? `
          <div class="recommendation-reason">${user.recommendation_reason}</div>` : ''}
        </div>
      `;
      container.appendChild(el);
    });
  }

  // ── Trending posts ─────────────────────────────────────
  async function loadTrending() {
    const container = document.getElementById('trending-container');
    container.innerHTML = skeletonPost();

    // reuse feed endpoint because it is already sorted by professional score
    const res   = await fetch('/feed');
    const data  = await res.json();
    const top3  = (data.posts || []).slice(0, 3);

    container.innerHTML = '';
    top3.forEach((post, index) => {
      const delay = index * 70;
      const el    = document.createElement('div');
      el.className = 'post-card';
      el.style.animationDelay = `${delay}ms`;
      el.innerHTML = `
        <span class="source-badge source-trending">Trending #${index + 1}</span>

        <div class="post-header">
          <img class="post-avatar"
               src="${post.author_avatar}"
               alt="${post.author_name}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.author_name)}&background=B24020&color=fff&size=92'">
          <div>
            <div class="author-name">${post.author_name}</div>
            <div class="author-headline">${post.author_headline}</div>
            <div class="post-time">${post.timestamp}</div>
          </div>
        </div>

        <p class="post-content">${post.content}</p>

        <div class="post-tags">
          ${(post.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}
        </div>

        <div class="post-stats">
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
            ${post.likes}
          </span>
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2h14l4 4-.01-18z"/></svg>
            ${post.comments}
          </span>
          <span class="stat-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            ${post.shares}
          </span>
        </div>
      `;
      container.appendChild(el);
    });
  }

  // ── Skeleton helper ────────────────────────────────────
  function skeletonPost() {
    return `
      <div class="post-card" style="opacity:1">
        <div class="post-header">
          <div class="skeleton-avatar"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:55%"></div>
            <div class="skeleton" style="width:40%"></div>
          </div>
        </div>
        <div class="skeleton"></div>
        <div class="skeleton" style="width:80%"></div>
        <div class="skeleton" style="width:60%"></div>
      </div>`;
  }

  init();
</script>
</body>
</html>
