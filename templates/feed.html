<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkGraph — Feed</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/CSS/feed.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/">Link<span>Graph</span></a>

  <div class="nav-center">
    <a class="nav-link active" href="/">Feed</a>
    <a class="nav-link " href="/connections-page">Network</a>
    <a class="nav-link" href="/recommendations-page">Recommendations</a>
    <a class="nav-link" href="/communities-page">Communities</a>
  </div>

  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <img class="nav-avatar" id="nav-avatar" src="" alt=""
         onerror="this.style.display='none'">
    <a href="/logout" class="signout">Sign out</a>
  </div>
</nav>


<div class="layout">

  <!-- ── LEFT: Feed ── -->
  <div>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <div class="page-title">Feed</div>
      </div>
      
    </div>

    <!-- Active filter bar (hidden until a tag is clicked) -->
    <div class="filter-bar" id="filter-bar" style="display:none">
      <span style="font-size:12px;color:var(--muted);align-self:center">Filter:</span>
      <button class="filter-chip active" onclick="clearFilter()">All posts</button>
      <button class="filter-chip active" id="active-filter-chip"></button>
    </div>

    <!-- Posts -->
    <div id="posts-container">
      <!-- skeletons -->
      <div class="post-card" style="opacity:1">
        <div class="post-header">
          <div class="sk-avatar"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:55%"></div>
            <div class="skeleton" style="width:40%"></div>
          </div>
        </div>
        <div class="skeleton"></div>
        <div class="skeleton" style="width:80%"></div>
      </div>
      <div class="post-card" style="opacity:1">
        <div class="post-header">
          <div class="sk-avatar"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:50%"></div>
            <div class="skeleton" style="width:38%"></div>
          </div>
        </div>
        <div class="skeleton"></div>
        <div class="skeleton" style="width:72%"></div>
      </div>
    </div>

  </div>


  <!-- ── RIGHT: Sidebar ── -->




  <aside>




    <!-- Create Post box -->
<div class="sidebar-card" style="padding:14px 16px;margin-bottom:14px;background:white;border-radius:12px;border:1px solid var(--border)">
  <div style="display:flex;gap:10px;align-items:center">
    <img id="composer-avatar" src="" alt=""
         style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--blue-light)"
         onerror="this.src='https://ui-avatars.com/api/?name=U&background=0077B5&color=fff&size=80'">
    <button onclick="openComposer()"
            style="flex:1;text-align:left;padding:10px 16px;border-radius:24px;border:1.5px solid var(--border);background:none;font-size:14px;color:var(--muted);cursor:pointer;font-family:DM Sans,sans-serif;transition:all 0.15s"
            onmouseover="this.style.borderColor='var(--blue)';this.style.color='var(--blue)'"
            onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
      Share an insight, role update, or opportunity...
    </button>
  </div>
</div>

<!-- Post composer modal -->
<div id="composer-modal"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:white;border-radius:14px;width:100%;max-width:540px;margin:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.2)">

    <!-- Modal header -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)">
      <div style="font-size:16px;font-weight:600">Create a post</div>
      <button onclick="closeComposer()"
              style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted);line-height:1">✕</button>
    </div>

    <!-- Author row -->
    <div style="display:flex;align-items:center;gap:10px;padding:16px 20px 0">
      <img id="modal-avatar" src="" alt=""
           style="width:44px;height:44px;border-radius:50%;object-fit:cover"
           onerror="this.src='https://ui-avatars.com/api/?name=U&background=0077B5&color=fff&size=88'">
      <div>
        <div id="modal-name" style="font-size:14px;font-weight:600"></div>
        <div style="font-size:11px;color:var(--muted)">Post to all connections</div>
      </div>
    </div>

    <!-- Textarea -->
    <div style="padding:12px 20px">
      <textarea id="post-content"
                placeholder="What do you want to talk about?"
                style="width:100%;min-height:140px;border:none;outline:none;font-size:15px;font-family:DM Sans,sans-serif;color:var(--text);resize:none;line-height:1.6"
                oninput="updateCharCount()"></textarea>
      <div style="display:flex;justify-content:flex-end;font-size:11px;color:var(--muted)">
        <span id="char-count">0</span>/1000
      </div>
    </div>

    <!-- Modal footer -->
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--border)">
      <div id="post-error" style="font-size:12px;color:#C0392B;flex:1"></div>
      <button onclick="closeComposer()"
              style="padding:8px 18px;border-radius:20px;border:1.5px solid var(--border);background:none;font-size:13px;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif">
        Cancel
      </button>
      <button id="post-btn" onclick="submitPost()"
              style="padding:8px 20px;border-radius:20px;background:var(--blue);color:white;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif;transition:background 0.15s">
        Post
      </button>
    </div>

  </div>
</div>



    <div class="sidebar-card" style="margin-bottom:14px">
    <div style="height:48px;background:linear-gradient(135deg,#0A66C2,#0096CC);border-radius:12px 12px 0 0"></div>
    <div style="padding:0 16px 16px;text-align:center">
      <img id="side-avatar"
           src="" alt=""
           style="width:52px;height:52px;border-radius:50%;border:3px solid white;margin-top:-26px;object-fit:cover;display:block;margin-left:auto;margin-right:auto"
           onerror="this.src='https://ui-avatars.com/api/?name=User&background=0077B5&color=fff&size=104'">
      <div id="side-name"     style="font-size:15px;font-weight:600;margin-top:8px"></div>
      <div id="side-headline" style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.4"></div>

      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:12px">
        <span style="color:var(--muted)">Company</span>
        <span id="side-company" style="font-weight:600"></span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:12px">
        <span style="color:var(--muted)">Connections</span>
        <span id="side-connections" style="font-weight:600;color:var(--blue)"></span>
      </div>

      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center" id="side-skills"></div>
    </div>
  </div>

  </aside>

</div>


<script>
  let allPosts      = [];
  let activeFilter  = null;
  let myConnections = [];

  async function init() {
    // load current user for nav
    const meRes = await fetch('/me');
    if (meRes.status === 401) { window.location.href = '/login'; return; }
    const me = await meRes.json();

    document.getElementById('nav-user').textContent = me.name.split(' ')[0];
    document.getElementById('nav-avatar').src       = me.avatar;
    myConnections = me.connections_list || [];
    document.getElementById('composer-avatar').src = me.avatar;
    document.getElementById('modal-avatar').src     = me.avatar;
    document.getElementById('modal-name').textContent = me.name;
    document.getElementById('side-avatar').src        = me.avatar;
    document.getElementById('side-name').textContent  = me.name;
    document.getElementById('side-headline').textContent = me.headline;
    document.getElementById('side-company').textContent  = me.company;
    document.getElementById('side-connections').textContent = me.connections_list
  ? me.connections_list.length
  : '—';
document.getElementById('side-skills').innerHTML = (me.skills || []).map(s =>
  `<span style="font-size:10px;color:var(--blue);background:var(--blue-light);padding:2px 8px;border-radius:10px;font-weight:500">${s}</span>`
).join('');

    await loadFeed();
  }

  async function loadFeed() {
    const container = document.getElementById('posts-container');
    container.innerHTML = skeletonPost() + skeletonPost();

    const res  = await fetch('/feed');
    const data = await res.json();

    allPosts = data.posts || [];
    renderPosts(allPosts);
  }

  // ── Render posts ───────────────────────────────────────
  function renderPosts(posts) {
    const container = document.getElementById('posts-container');
    container.innerHTML = '';

    if (!posts.length) {
      container.innerHTML = '<div class="empty-state">No posts match this filter.</div>';
      return;
    }

    posts.forEach((post, index) => {
      const delay      = index * 55;

      const el = document.createElement('div');
      el.className = 'post-card';
      el.style.animationDelay = `${delay}ms`;

      el.innerHTML = `
        <div class="post-header">
          <img class="post-avatar"
               src="${post.author_avatar}"
               alt="${post.author_name}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.author_name)}&background=0077B5&color=fff&size=88'">
          <div style="flex:1;min-width:0">
            <div class="author-name">${post.author_name}</div>
            <div class="author-headline">${post.author_headline}</div>
            <div class="post-time">${post.timestamp}</div>
          </div>
        </div>

        <p class="post-content">${post.content}</p>

        ${(post.tags || []).length ? `
        <div class="post-tags">
          ${post.tags.map(t => `
            <span class="tag ${activeFilter === t ? 'active-tag' : ''}"
                  onclick="filterByTag('${t}')">#${t}</span>
          `).join('')}
        </div>` : ''}

        <div class="post-stats">
          <button class="action-btn" onclick="likePost(${post.id}, this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
            <span id="like-count-${post.id}">${post.likes}</span> likes
          </button>
          <button class="action-btn" onclick="toggleCommentBox(${post.id})">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
            <span id="comment-count-${post.id}">${post.comments}</span> comments
          </button>
          <span class="si">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            ${post.shares} shares
          </span>
        </div>
        <div class="comment-box" id="comment-box-${post.id}" style="display:none">
          <div class="comment-list" id="comment-list-${post.id}">
            ${renderDemoComments(post.demo_comments || [])}
          </div>
          <div class="comment-input-row">
            <input id="comment-input-${post.id}" maxlength="180" placeholder="Add a short comment">
            <button onclick="submitComment(${post.id}, this)">Comment</button>
          </div>
        </div>
      `;
      container.appendChild(el);
    });
  }

  function escapeHtml(value) {
    return String(value || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function renderDemoComments(comments) {
    return comments.map(comment => `
      <div class="comment-item">
        <strong>${escapeHtml(comment.author)}</strong>
        <span>${escapeHtml(comment.content)}</span>
      </div>
    `).join('');
  }

  async function likePost(postId, btn) {
    btn.disabled = true;
    const res = await fetch(`/post/${postId}/like`, { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      document.getElementById(`like-count-${postId}`).textContent = data.likes;
      btn.classList.add('liked');
    }
    btn.disabled = false;
  }

  function toggleCommentBox(postId) {
    const box = document.getElementById(`comment-box-${postId}`);
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') {
      document.getElementById(`comment-input-${postId}`).focus();
    }
  }

  async function submitComment(postId, btn) {
    const input = document.getElementById(`comment-input-${postId}`);
    const content = input.value.trim();
    if (!content) return;

    btn.disabled = true;
    const res = await fetch(`/post/${postId}/comment`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById(`comment-count-${postId}`).textContent = data.comments;
      document.getElementById(`comment-list-${postId}`).innerHTML = renderDemoComments(data.demo_comments || []);
      input.value = '';
    }
    btn.disabled = false;
  }

  // ── Tag filter ─────────────────────────────────────────
  function filterByTag(tag) {
    if (activeFilter === tag) {
      clearFilter();
      return;
    }

    activeFilter = tag;
    document.getElementById('filter-bar').style.display = 'flex';
    document.getElementById('active-filter-chip').textContent = `#${tag}`;

    const filtered = allPosts.filter(p => (p.tags || []).includes(tag));
    renderPosts(filtered);
  }

  function clearFilter() {
    activeFilter = null;
    document.getElementById('filter-bar').style.display = 'none';
    renderPosts(allPosts);
  }

  // ── Skeleton ───────────────────────────────────────────
  function skeletonPost() {
    return `
      <div class="post-card" style="opacity:1">
        <div class="post-header">
          <div class="sk-avatar"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:55%"></div>
            <div class="skeleton" style="width:40%"></div>
          </div>
        </div>
        <div class="skeleton"></div>
        <div class="skeleton" style="width:75%"></div>
      </div>`;
  }



  function openComposer() {
  document.getElementById('composer-modal').style.display = 'flex';
  document.getElementById('post-content').focus();
}

function closeComposer() {
  document.getElementById('composer-modal').style.display = 'none';
  document.getElementById('post-content').value = '';
  document.getElementById('char-count').textContent = '0';
  document.getElementById('post-error').textContent = '';
  document.getElementById('post-btn').textContent = 'Post';
  document.getElementById('post-btn').disabled = false;
}

function updateCharCount() {
  const len = document.getElementById('post-content').value.length;
  document.getElementById('char-count').textContent = len;
  document.getElementById('char-count').style.color = len > 900 ? '#C0392B' : 'var(--muted)';
}

async function submitPost() {
  const content = document.getElementById('post-content').value.trim();
  const btn     = document.getElementById('post-btn');
  const errEl   = document.getElementById('post-error');

  if (!content) {
    errEl.textContent = 'Please write something first.';
    return;
  }

  btn.textContent = 'Posting...';
  btn.disabled    = true;

  const res  = await fetch('/post', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ content })
  });
  const data = await res.json();

  if (data.success) {
    closeComposer();
    await loadFeed();   // reload feed to show new post
  } else {
    errEl.textContent = data.error || 'Something went wrong.';
    btn.textContent   = 'Post';
    btn.disabled      = false;
  }
}

  init();
</script>
</body>
</html>
