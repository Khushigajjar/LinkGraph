<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkGraph — Communities</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='CSS/communities.css') }}">

</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/">Link<span>Graph</span></a>

  <div class="nav-center">
    <a class="nav-link" href="/feed-page">Feed Ranking</a>
    <a class="nav-link" href="/connections-page">Connections</a>
    <a class="nav-link" href="/recommendations-page">Recommendations</a>
    <a class="nav-link active" href="/communities-page">Communities</a>
  </div>

  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <img class="nav-avatar" id="nav-avatar" src="" alt=""
         onerror="this.style.display='none'">
    <a href="/logout" class="signout">Sign out</a>
  </div>
</nav>


<div class="layout">

  <!-- LEFT: Main -->
  <div>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <div class="page-title">Professional Communities</div>
        <div class="page-subtitle">Groups formed around shared professional skills</div>
      </div>
    </div>

   

    <!-- Skill Clusters tab (always visible) -->
    <div id="tab-clusters">
      <div id="clusters-container">
        <!-- Skeleton loader -->
        <div class="component-card" style="opacity:1">
          <div style="display:flex;gap:8px;margin-bottom:12px">
            <div class="skeleton-avatar"></div>
            <div class="skeleton-avatar"></div>
            <div class="skeleton-avatar"></div>
          </div>
          <div class="skeleton" style="width:60%"></div>
          <div class="skeleton" style="width:40%"></div>
        </div>
      </div>
    </div>

   

  </div>

</div>


<script>
  let communityData = null;

  async function init() {
    const res     = await fetch('/communities');
    communityData = await res.json();

    const clusters = (communityData.skill_clusters || []).filter(cluster => cluster.length >= 2);

    

    const meRes = await fetch('/me');
    if (meRes.status === 401) { window.location.href = '/login'; return; }
    const me = await meRes.json();
    const navUser = document.getElementById('nav-user');
    const navAvatar = document.getElementById('nav-avatar');
    if (navUser) navUser.textContent = me.name.split(' ')[0];
    if (navAvatar) navAvatar.src = me.avatar;

    renderClusters(clusters);
  }

 

  // ── Skill Clusters ─────────────────────────────────────
  function renderClusters(clusters) {
    const container = document.getElementById('clusters-container');
    container.innerHTML = '';

    if (!clusters.length) {
      container.innerHTML = '<div class="empty-state">No communities found yet.</div>';
      return;
    }

    clusters.filter(cluster => cluster.length >= 2).forEach((cluster, idx) => {
      const delay = idx * 80;

      const skillSets    = cluster.map(u => new Set(u.skills || []));
      const commonSkills = skillSets.length
        ? [...skillSets[0]].filter(s => skillSets.every(set => set.has(s)))
        : [];
      const focusSkills = (cluster[0] && cluster[0].cluster_focus) || commonSkills;
      const communityName = (cluster[0] && cluster[0].community_name) || `${focusSkills[0] || 'Professional'} Community`;
      const summary = (cluster[0] && cluster[0].cluster_summary) || 'Professionals grouped by shared skills';

      const el = document.createElement('div');
      el.className = 'component-card';
      el.style.animationDelay = `${delay}ms`;

      const avatarStack = cluster.slice(0, 4).map(u => `
        <img src="${u.avatar}"
             alt="${u.name}"
             onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=7B2D8B&color=fff&size=64'">
      `).join('');

      const extra = cluster.length > 4
        ? `<div class="avatar-count">+${cluster.length - 4}</div>`
        : '';

      const memberRows = cluster.map(u => `
        <div class="member-row">
          <img src="${u.avatar}"
               alt="${u.name}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=7B2D8B&color=fff&size=72'">
          <div class="member-info">
            <div class="member-name">${u.name}</div>
            <div class="member-headline">${u.headline}</div>
            <div class="member-skills">
              ${(u.skills || []).slice(0, 3).map(s =>
                `<span class="skill-tag skill-purple">${s}</span>`
              ).join('')}
            </div>
          </div>
        </div>
      `).join('');

      el.innerHTML = `
        <div class="component-header">
          <div class="component-title">
            ${communityName}
          </div>
          <span class="component-badge badge-cluster">${cluster.length} member${cluster.length !== 1 ? 's' : ''}</span>
        </div>

        <div class="avatar-stack">
          ${avatarStack}${extra}
        </div>

        <div class="cluster-summary">${summary}</div>

        ${commonSkills.length ? `
        <div style="margin-bottom:12px;font-size:12px;color:var(--muted)">
          Shared skills:
          ${commonSkills.map(s => `<span class="skill-tag skill-purple" style="margin-left:4px">${s}</span>`).join('')}
        </div>` : ''}

        <div class="member-list">
          ${memberRows}
        </div>
      `;

      container.appendChild(el);
    });
  }

 

  init();
</script>
</body>
</html>
