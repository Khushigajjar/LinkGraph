  // ── Skill Clusters ─────────────────────────────────────
  function renderClusters(clusters) {
    const container = document.getElementById('clusters-container');
    container.innerHTML = '';

    if (!clusters.length) {
      container.innerHTML = '<div class="empty-state">No communities found yet.</div>';
      return;
    }

    clusters.filter(cluster => cluster.length >= 2).forEach((cluster, idx) => {
      const delay = idx * 80;

      const skillSets    = cluster.map(u => new Set(u.skills || []));
      const commonSkills = skillSets.length
        ? [...skillSets[0]].filter(s => skillSets.every(set => set.has(s)))
        : [];
      const focusSkills = (cluster[0] && cluster[0].cluster_focus) || commonSkills;
      const communityName = (cluster[0] && cluster[0].community_name) || `${focusSkills[0] || 'Professional'} Community`;
      const summary = (cluster[0] && cluster[0].cluster_summary) || 'Professionals grouped by shared skills';

      const el = document.createElement('div');
      el.className = 'component-card';
      el.style.animationDelay = `${delay}ms`;

      const avatarStack = cluster.slice(0, 4).map(u => `
        <img src="${u.avatar}"
             alt="${u.name}"
             onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=7B2D8B&color=fff&size=64'">
      `).join('');

      const extra = cluster.length > 4
        ? `<div class="avatar-count">+${cluster.length - 4}</div>`
        : '';

      const memberRows = cluster.map(u => `
        <div class="member-row">
          <img src="${u.avatar}"
               alt="${u.name}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=7B2D8B&color=fff&size=72'">
          <div class="member-info">
            <div class="member-name">${u.name}</div>
            <div class="member-headline">${u.headline}</div>
            <div class="member-skills">
              ${(u.skills || []).slice(0, 3).map(s =>
                `<span class="skill-tag skill-purple">${s}</span>`
              ).join('')}
            </div>
          </div>
        </div>
      `).join('');

      el.innerHTML = `
        <div class="component-header">
          <div class="component-title">
            ${communityName}
          </div>
          <span class="component-badge badge-cluster">${cluster.length} member${cluster.length !== 1 ? 's' : ''}</span>
        </div>

        <div class="avatar-stack">
          ${avatarStack}${extra}
        </div>

        <div class="cluster-summary">${summary}</div>

        ${commonSkills.length ? `
        <div style="margin-bottom:12px;font-size:12px;color:var(--muted)">
          Shared skills:
          ${commonSkills.map(s => `<span class="skill-tag skill-purple" style="margin-left:4px">${s}</span>`).join('')}
        </div>` : ''}

        <div class="member-list">
          ${memberRows}
        </div>
      `;

      container.appendChild(el);
    });
  }
