<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkGraph — Connections</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/templates/CSS/connection.css">
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="/">Link<span>Graph</span></a>

  <div class="nav-center">
    <a class="nav-link" href="/feed-page">Feed Ranking</a>
    <a class="nav-link active" href="/connections-page">Connections</a>
    <a class="nav-link" href="/recommendations-page">Recommendations</a>
    <a class="nav-link" href="/communities-page">Communities</a>
  </div>

  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <img class="nav-avatar" id="nav-avatar" src="" alt=""
         onerror="this.style.display='none'">
    <a href="/logout" class="signout">Sign out</a>
  </div>
</nav>


<div class="layout">

  <!-- LEFT: Main -->
  <div>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <div class="page-title">Connection Finding</div>
      </div>
      
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-num" id="stat-direct">—</div>
        <div class="stat-box-label">Direct connections</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-num" id="stat-suggestions">—</div>
        <div class="stat-box-label">People suggestions</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-num" id="stat-skill">—</div>
        <div class="stat-box-label">Skill matches</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="section-tabs">
      <button class="section-tab active" onclick="switchTab('suggestions', this)">People You May Know</button>
      <button class="section-tab" onclick="switchTab('network', this)">My Network</button>
      <button class="section-tab" onclick="switchTab('skills', this)">Skill Matches</button>
    </div>

    <!-- BFS suggestions tab -->
    <div id="tab-suggestions">
      <div id="suggestions-container">
        <div class="conn-card" style="opacity:1">
          <div class="skeleton-avatar"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:50%"></div>
            <div class="skeleton" style="width:70%"></div>
            <div class="skeleton" style="width:40%"></div>
          </div>
        </div>
        <div class="conn-card" style="opacity:1">
          <div class="skeleton-avatar"></div>
          <div style="flex:1">
            <div class="skeleton" style="width:55%"></div>
            <div class="skeleton" style="width:65%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- My network tab -->
    <div id="tab-network" style="display:none">
      <div id="network-container"></div>
    </div>

    <!-- Skill matches tab -->
    <div id="tab-skills" style="display:none">
      <div id="skills-container"></div>
    </div>

  </div>


  <!-- RIGHT: Sidebar -->
  <aside>

    <div class="card">
  <div class="sidebar-section">
    <div class="sidebar-title">My Skills</div>
    <div id="my-skills" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>
</div>

    <!-- Algorithm explainer -->
    <div class="card">
      
      <div class="sidebar-section">
        <div class="sidebar-title">Complexity</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.8">
          BFS traversal: <strong style="color:var(--text)">O(V + E)</strong><br>
          Set intersection: <strong style="color:var(--text)">O(min(n,m))</strong><br>
          Jaccard scoring: <strong style="color:var(--text)">O(n)</strong><br>
          Recommendation reason: mutual links + shared skills
        </div>
      </div>
    </div>

  </aside>

</div>


<script>
 let allUsers   = [];
let currentTab = 'suggestions';

async function init() {

  const meRes = await fetch('/me');
    if (meRes.status === 401) { window.location.href = '/login'; return; }
    const me = await meRes.json();
  document.getElementById('nav-user').textContent = me.name.split(' ')[0];
  document.getElementById('nav-avatar').src       = me.avatar;
  const res = await fetch('/users');
  allUsers  = await res.json();
  await loadCurrentTab();
  await loadMySkills();

  
}

async function loadMySkills() {
  const res  = await fetch('/me');
  const me   = await res.json();

  const container = document.getElementById('my-skills');
  if (!container) return;

  container.innerHTML = (me.skills || []).map(s =>
    `<span class="skill-tag">${s}</span>`
  ).join('');
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-suggestions').style.display = tab === 'suggestions' ? 'block' : 'none';
  document.getElementById('tab-network').style.display     = tab === 'network'     ? 'block' : 'none';
  document.getElementById('tab-skills').style.display      = tab === 'skills'      ? 'block' : 'none';
  loadCurrentTab();
}

async function loadCurrentTab() {
  if (currentTab === 'suggestions') await loadSuggestions();
  if (currentTab === 'network')     await loadMyNetwork();
  if (currentTab === 'skills')      await loadSkillMatches();
}

// ── BFS Suggestions ────────────────────────────────────
async function loadSuggestions() {
  const container = document.getElementById('suggestions-container');
  container.innerHTML = skeletonCard() + skeletonCard();

  const res  = await fetch('/suggestions');
  const data = await res.json();

  const bfs = data.filter(s => s.source === 'network');
  document.getElementById('stat-suggestions').textContent = bfs.length;

  if (!bfs.length) {
    container.innerHTML = '<div class="empty-state">No BFS suggestions found.</div>';
    return;
  }

  container.innerHTML = '';
  bfs.forEach((person, index) => {
    const delay    = index * 70;
    const barWidth = (person.jaccard_score * 100).toFixed(0);
    const mutuals  = person.mutual_friends || [];

    const el = document.createElement('div');
    el.className = 'conn-card';
    el.style.animationDelay = `${delay}ms`;
    el.innerHTML = `
      <img class="conn-avatar"
           src="${person.avatar}"
           alt="${person.name}"
           onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(person.name)}&background=0096A0&color=fff&size=112'">
      <div class="conn-body">
        <div class="conn-name">${person.name}</div>
        <div class="conn-headline">${person.headline}</div>
        <span class="degree-badge degree-${person.degree === 2 ? '2' : '3'}">${person.degree}${person.degree === 2 ? 'nd' : 'rd'} degree</span>
        
        <div class="jaccard-wrap">
          <div class="jaccard-label">
            <span>Network overlap</span>
            <strong>${(person.jaccard_score * 100).toFixed(0)}%</strong>
          </div>
          <div class="jaccard-track">
            <div class="jaccard-fill" style="width: ${barWidth}%"></div>
          </div>
        </div>
        ${person.recommendation_reason ? `<div class="reason-line">${person.recommendation_reason}</div>` : ''}
        ${(person.shared_skills || []).length ? `
        <div class="shared-skills">
          ${person.shared_skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}
        </div>` : ''}
        ${mutuals.length ? `
        <div class="mutual-row">
          <div class="mutual-avatars">
            ${mutuals.slice(0, 3).map(m => `
              <img src="${m.avatar}" alt="${m.name}"
                   onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.name)}&background=0077B5&color=fff&size=40'">
            `).join('')}
          </div>
          <span class="mutual-text">
            <strong>${mutuals[0].name}</strong>
            ${mutuals.length > 1 ? `and ${mutuals.length - 1} other${mutuals.length > 2 ? 's' : ''} ` : ''}
            in common
          </span>
        </div>` : ''}
      </div>
      <button class="connect-btn" onclick="handleConnect(this)">+ Connect</button>
    `;
    container.appendChild(el);
  });
}

// ── My Network ─────────────────────────────────────────
async function loadMyNetwork() {
  const container = document.getElementById('network-container');
  container.innerHTML = skeletonCard();

  // get current user's profile to find their connections
  const res  = await fetch('/me');
  const me   = await res.json();

  const directUsers = allUsers.filter(u => (me.connections_list || []).includes(u.id));
  document.getElementById('stat-direct').textContent = directUsers.length;

  if (!directUsers.length) {
    container.innerHTML = '<div class="empty-state">No direct connections yet.</div>';
    return;
  }

  container.innerHTML = '';
  directUsers.forEach((person, index) => {
    const el = document.createElement('div');
    el.className = 'direct-card';
    el.style.animationDelay = `${index * 60}ms`;
    el.innerHTML = `
      <img src="${person.avatar}" alt="${person.name}"
           onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(person.name)}&background=057642&color=fff&size=92'">
      <div class="direct-info">
        <div class="direct-name">${person.name}</div>
        <div class="direct-headline">${person.headline}</div>
      </div>
      <span class="connected-tag">Connected</span>
    `;
    container.appendChild(el);
  });
}

// ── Skill Matches ──────────────────────────────────────
async function loadSkillMatches() {
  const container = document.getElementById('skills-container');
  container.innerHTML = skeletonCard();

  const res  = await fetch('/suggestions');
  const data = await res.json();

  const skillBased = data.filter(s => s.source === 'skills');
  document.getElementById('stat-skill').textContent = skillBased.length;

  if (!skillBased.length) {
    container.innerHTML = '<div class="empty-state">No skill-based matches found.</div>';
    return;
  }

  container.innerHTML = '';
  skillBased.forEach((person, index) => {
    const barWidth = ((person.skill_overlap || 0) * 100).toFixed(0);
    const el = document.createElement('div');
    el.className = 'conn-card';
    el.style.animationDelay = `${index * 70}ms`;
    el.innerHTML = `
      <img class="conn-avatar"
           src="${person.avatar}"
           alt="${person.name}"
           onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(person.name)}&background=0096A0&color=fff&size=112'">
      <div class="conn-body">
        <div class="conn-name">${person.name}</div>
        <div class="conn-headline">${person.headline}</div>
        ${person.recommendation_reason ? `<div class="reason-line">${person.recommendation_reason}</div>` : ''}
        <div class="jaccard-wrap" style="margin-top:8px">
          <div class="jaccard-label">
            <span>Skill overlap</span>
            <strong>${barWidth}%</strong>
          </div>
          <div class="jaccard-track">
            <div class="jaccard-fill" style="width: ${barWidth}%"></div>
          </div>
        </div>
        <div class="shared-skills">
          ${(person.shared_skills || []).map(s => `<span class="skill-tag">${s}</span>`).join('')}
        </div>
      </div>
      <button class="connect-btn" onclick="handleConnect(this)">+ Connect</button>
    `;
    container.appendChild(el);
  });
}

function handleConnect(btn) {
  btn.textContent = '✓ Sent';
  btn.classList.add('connected');
}

function skeletonCard() {
  return `
    <div class="conn-card" style="opacity:1">
      <div class="skeleton-avatar"></div>
      <div style="flex:1">
        <div class="skeleton" style="width:50%"></div>
        <div class="skeleton" style="width:70%"></div>
        <div class="skeleton" style="width:35%"></div>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
