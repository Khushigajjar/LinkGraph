<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkGraph</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:       #0A66C2;
    --blue-light: #E8F0FA;
    --blue-dark:  #004182;
    --bg:         #F3F2EE;
    --white:      #FFFFFF;
    --text:       #191919;
    --muted:      #666666;
    --border:     #E0DFDC;
    --card:       #FFFFFF;
    --green:      #057642;
    --radius:     12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── NAV ── */
  nav {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--blue);
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  .nav-logo span { color: var(--text); }

  .nav-tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    justify-content: center;
  }

  .nav-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    border: none;
    background: none;
    transition: color 0.15s, background 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .nav-tab svg { width: 20px; height: 20px; }

  .nav-tab:hover { background: var(--bg); color: var(--text); }

  .nav-tab.active {
    color: var(--text);
    border-bottom: 2px solid var(--text);
    border-radius: 0;
  }

  /* ── LAYOUT ── */
  .layout {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 240px 1fr 280px;
    gap: 20px;
    align-items: start;
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ── LEFT SIDEBAR: Profile ── */
  .profile-card { text-align: center; }

  .profile-banner {
    height: 56px;
    background: linear-gradient(135deg, #0A66C2, #0096CC);
  }

  .profile-avatar-wrap {
    margin: -28px auto 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 3px solid var(--white);
    overflow: hidden;
    background: var(--blue-light);
  }

  .profile-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile-info { padding: 10px 16px 16px; }

  .profile-name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .profile-headline {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    margin-bottom: 12px;
  }

  .profile-stat {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-top: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
  }

  .profile-stat:hover .stat-count { color: var(--blue); }

  .stat-label { color: var(--muted); }
  .stat-count { font-weight: 600; color: var(--text); }

  /* user switcher */
  .switcher {
    padding: 12px;
    border-top: 1px solid var(--border);
  }

  .switcher-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    font-weight: 500;
  }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
  }

  .user-pill:hover { background: var(--bg); }
  .user-pill.active { background: var(--blue-light); }

  .user-pill img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .pill-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── FEED ── */
  .feed-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .feed-tab-btn {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .feed-tab-btn.active {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
  }

  /* ── POST CARD ── */
  .post-card {
    margin-bottom: 12px;
    padding: 16px;
    animation: fadeUp 0.3s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .post-header {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: flex-start;
  }

  .post-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--blue-light);
  }

  .post-author-name {
    font-size: 14px;
    font-weight: 600;
  }

  .post-author-headline {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .post-time { font-size: 11px; color: var(--muted); }

  .post-content {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 12px;
  }

  .post-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .tag {
    font-size: 11px;
    color: var(--blue);
    background: var(--blue-light);
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 500;
  }

  /* score badge */
  .score-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--green);
    background: #E6F4ED;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 10px;
  }

  .score-badge svg { width: 12px; height: 12px; }

  .post-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .stat-item { display: flex; align-items: center; gap: 4px; }
  .stat-item svg { width: 14px; height: 14px; }

  /* rank badge */
  .rank-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
    flex-shrink: 0;
  }

  .rank-1 { background: #FFD700; color: #7a5900; }
  .rank-2 { background: #C0C0C0; color: #444; }
  .rank-3 { background: #CD7F32; color: white; }
  .rank-other { background: var(--bg); color: var(--muted); }

  /* ── RIGHT SIDEBAR ── */
  .sidebar-section { padding: 16px; }
  .sidebar-section + .sidebar-section { border-top: 1px solid var(--border); }

  .sidebar-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  /* connection suggestion card */
  .connection-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }

  .connection-card + .connection-card {
    border-top: 1px solid var(--border);
  }

  .connection-card img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .conn-info { flex: 1; min-width: 0; }

  .conn-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .conn-headline {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .connect-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--blue);
    background: none;
    color: var(--blue);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .connect-btn:hover {
    background: var(--blue);
    color: white;
  }

  /* ── LOADING ── */
  .skeleton {
    background: linear-gradient(90deg, var(--bg) 25%, #e8e8e4 50%, var(--bg) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    border-radius: 6px;
    height: 14px;
    margin-bottom: 8px;
  }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .skeleton-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(90deg, var(--bg) 25%, #e8e8e4 50%, var(--bg) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    flex-shrink: 0;
  }

  /* ── EMPTY ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  /* ── VIEW SELECTOR ── */
  #view-feed, #view-connections { display: block; }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">Link<span>Graph</span></div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('feed', this)">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Feed
    </button>
    <button class="nav-tab" onclick="switchView('connections', this)">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Network
    </button>
  </div>

  <!-- active user avatar in nav -->
  <img id="nav-avatar" src="" width="32" height="32"
       style="border-radius:50%;border:2px solid var(--blue);object-fit:cover;display:none">
</nav>


<!-- LAYOUT -->
<div class="layout">

  <!-- LEFT: Profile + User Switcher -->
  <aside>
    <div class="card profile-card" id="profile-panel">
      <div class="profile-banner"></div>
      <div class="profile-avatar-wrap">
        <img id="profile-img" src="" alt="avatar">
      </div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">Loading...</div>
        <div class="profile-headline" id="profile-headline"></div>
        <div class="profile-stat">
          <span class="stat-label">Connections</span>
          <span class="stat-count" id="profile-connections">—</span>
        </div>
        <div class="profile-stat">
          <span class="stat-label">Company</span>
          <span class="stat-count" id="profile-company">—</span>
        </div>
      </div>

      <div class="switcher">
        <div class="switcher-label">Switch user</div>
        <div id="user-list"></div>
      </div>
    </div>
  </aside>


  <!-- CENTER: Feed or Connections -->
  <main>

    <!-- FEED VIEW -->
    <div id="view-feed">
      <div class="feed-tabs">
        <button class="feed-tab-btn active">Ranked feed</button>
        <button class="feed-tab-btn" style="cursor:default;opacity:0.5">For you</button>
      </div>
      <div id="posts-container">
        <!-- skeleton loaders -->
        <div class="card post-card" style="opacity:1">
          <div style="display:flex;gap:10px;margin-bottom:10px">
            <div class="skeleton-avatar"></div>
            <div style="flex:1"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:40%"></div></div>
          </div>
          <div class="skeleton"></div><div class="skeleton" style="width:85%"></div><div class="skeleton" style="width:70%"></div>
        </div>
        <div class="card post-card" style="opacity:1">
          <div style="display:flex;gap:10px;margin-bottom:10px">
            <div class="skeleton-avatar"></div>
            <div style="flex:1"><div class="skeleton" style="width:55%"></div><div class="skeleton" style="width:38%"></div></div>
          </div>
          <div class="skeleton"></div><div class="skeleton" style="width:90%"></div>
        </div>
      </div>
    </div>

    <!-- CONNECTIONS VIEW -->
    <div id="view-connections" style="display:none">
      <h2 style="font-size:16px;font-weight:600;margin-bottom:16px">People you may know</h2>
      <div id="connections-grid"
           style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
      </div>
    </div>

  </main>


  <!-- RIGHT: Suggested connections sidebar -->
  <aside>
    <div class="card">
      <div class="sidebar-section">
        <div class="sidebar-title">People you may know</div>
        <div id="suggestions-list">
          <div style="display:flex;gap:10px;align-items:center;padding:8px 0">
            <div class="skeleton-avatar" style="width:40px;height:40px"></div>
            <div style="flex:1"><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:50%"></div></div>
          </div>
          <div style="display:flex;gap:10px;align-items:center;padding:8px 0">
            <div class="skeleton-avatar" style="width:40px;height:40px"></div>
            <div style="flex:1"><div class="skeleton" style="width:65%"></div><div class="skeleton" style="width:45%"></div></div>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-title">Skills match</div>
        <div id="skills-list" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      </div>
    </div>
  </aside>

</div><!-- end layout -->


<script>
  let currentUserId = 1;
  let allUsers      = [];

  // ── Boot ──────────────────────────────────────────────
  async function init() {
    const res  = await fetch('/users');
    allUsers   = await res.json();
    renderUserSwitcher(allUsers);
    await selectUser(1);
  }

  // ── User switcher ─────────────────────────────────────
  function renderUserSwitcher(users) {
    const container = document.getElementById('user-list');
    container.innerHTML = users.map(u => `
      <button class="user-pill ${u.id === currentUserId ? 'active' : ''}"
              id="pill-${u.id}" onclick="selectUser(${u.id})">
        <img src="${u.avatar}" alt="${u.name}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0077B5&color=fff&size=64'">
        <span class="pill-name">${u.name.split(' ')[0]}</span>
      </button>
    `).join('');
  }

  async function selectUser(userId) {
    currentUserId = userId;

    // highlight active pill
    document.querySelectorAll('.user-pill').forEach(p => p.classList.remove('active'));
    const pill = document.getElementById(`pill-${userId}`);
    if (pill) pill.classList.add('active');

    // fetch user profile
    const user = allUsers.find(u => u.id === userId);
    if (user) {
      document.getElementById('profile-img').src         = user.avatar;
      document.getElementById('profile-name').textContent = user.name;
      document.getElementById('profile-headline').textContent = user.headline;
      document.getElementById('profile-company').textContent  = user.company;
      document.getElementById('profile-connections').textContent = user.connections || '—';
      document.getElementById('nav-avatar').src     = user.avatar;
      document.getElementById('nav-avatar').style.display = 'block';

      // skills
      const skillsEl = document.getElementById('skills-list');
      skillsEl.innerHTML = (user.skills || []).map(s =>
        `<span class="tag">${s}</span>`
      ).join('');
    }

    // reload feed + suggestions for new user
    await loadFeed();
    await loadSuggestions(userId);
  }

  // ── Feed ──────────────────────────────────────────────
  async function loadFeed() {
    const container = document.getElementById('posts-container');
    container.innerHTML = `
      <div class="card post-card" style="opacity:1">
        <div style="display:flex;gap:10px;margin-bottom:10px">
          <div class="skeleton-avatar"></div>
          <div style="flex:1"><div class="skeleton" style="width:60%"></div><div class="skeleton" style="width:40%"></div></div>
        </div>
        <div class="skeleton"></div><div class="skeleton" style="width:80%"></div>
      </div>`;

    const res   = await fetch('/feed');
    const posts = await res.json();
    renderPosts(posts);
  }

  function renderPosts(posts) {
    const container = document.getElementById('posts-container');
    container.innerHTML = '';

    posts.forEach((post, index) => {
      const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'rank-other';
      const delay     = index * 60;

      const el = document.createElement('div');
      el.className = 'card post-card';
      el.style.animationDelay = `${delay}ms`;
      el.innerHTML = `
        <div class="post-header">
          <span class="rank-pill ${rankClass}">${index + 1}</span>
          <img class="post-avatar" src="${post.author_avatar}"
               alt="${post.author_name}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(post.author_name)}&background=0077B5&color=fff&size=88'">
          <div>
            <div class="post-author-name">${post.author_name}</div>
            <div class="post-author-headline">${post.author_headline}</div>
            <div class="post-time">${post.timestamp}</div>
          </div>
        </div>

        <p class="post-content">${post.content}</p>

        <div class="post-tags">
          ${(post.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}
        </div>

        <div class="score-badge">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 3.21-1.81 6-4.72 7.72L13 17v5h5l-1.22-1.22C19.91 19.07 22 15.76 22 12c0-5.18-3.95-9.45-9-9.95zM11 2.05C5.95 2.55 2 6.82 2 12c0 3.76 2.09 7.07 5.22 8.78L6 22h5V2.05z"/></svg>
          Score: ${post.score}
        </div>

        <div class="post-stats">
          <span class="stat-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"/></svg>
            ${post.likes}
          </span>
          <span class="stat-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
            ${post.comments}
          </span>
          <span class="stat-item">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            ${post.shares}
          </span>
        </div>
      `;
      container.appendChild(el);
    });
  }

  // ── Connections ───────────────────────────────────────
  async function loadSuggestions(userId) {
    const res  = await fetch(`/connections/${userId}`);
    const data = await res.json();

    // right sidebar
    const list = document.getElementById('suggestions-list');
    if (!data.length) {
      list.innerHTML = '<div class="empty-state">No suggestions yet</div>';
    } else {
      list.innerHTML = data.map(u => `
        <div class="connection-card">
          <img src="${u.avatar}" alt="${u.name}"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0077B5&color=fff&size=80'">
          <div class="conn-info">
            <div class="conn-name">${u.name}</div>
            <div class="conn-headline">${u.headline}</div>
          </div>
          <button class="connect-btn">+ Follow</button>
        </div>
      `).join('');
    }

    // connections view (main area)
    const grid = document.getElementById('connections-grid');
    if (!data.length) {
      grid.innerHTML = '<div class="empty-state">No suggestions for this user yet.</div>';
    } else {
      grid.innerHTML = data.map(u => `
        <div class="card" style="padding:16px;text-align:center">
          <img src="${u.avatar}" alt="${u.name}"
               style="width:64px;height:64px;border-radius:50%;margin-bottom:8px;border:2px solid var(--blue-light)"
               onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=0077B5&color=fff&size=128'">
          <div style="font-size:14px;font-weight:600;margin-bottom:4px">${u.name}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.4">${u.headline}</div>
          <button class="connect-btn" style="width:100%">+ Connect</button>
        </div>
      `).join('');
    }
  }


  function switchView(view, btn) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    document.getElementById('view-feed').style.display        = view === 'feed'        ? 'block' : 'none';
    document.getElementById('view-connections').style.display = view === 'connections' ? 'block' : 'none';

    if (view === 'connections') loadSuggestions(currentUserId);
  }


  init();
</script>
</body>
</html>
