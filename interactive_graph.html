<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkGraph — Live Algorithmic Simulation Dashboard</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        :root {
            --linkedin-blue: #0A66C2;
            --bg-main: #f3f2ef;
            --text-dark: #1d1d1d;
            --text-muted: #5f5f5f;
            --border-color: #e0e0e0;
            --card-bg: #ffffff;
            --rec-orange: #ff5722;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background: var(--bg-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            color: var(--text-dark);
        }

        #sidebar {
            width: 340px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.03);
            overflow-y: auto;
            z-index: 10;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--linkedin-blue);
            margin-top: 0;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        
        .sidebar-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            font-weight: 600;
        }

        h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .instruction-box {
            background: #e7f3ff;
            padding: 14px;
            border-left: 4px solid var(--linkedin-blue);
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            line-height: 1.4;
            color: #004182;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .metric-card {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        #user-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        #user-headline {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 8px;
        }

        #user-company {
            font-size: 12px;
            font-weight: 600;
            color: var(--linkedin-blue);
            background: #e8f3ff;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
        }

        #user-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0;
        }

        .skill-tag {
            display: inline-block;
            background: #f2f4f8;
            color: #475569;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #e2e8f0;
        }

        #rec-summary {
            font-size: 13px;
            line-height: 1.5;
            color: #2c3e50;
        }

        .rec-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .rec-item:last-child {
            border-bottom: none;
        }

        .rec-arrow {
            color: var(--rec-orange);
            margin-right: 8px;
            font-weight: bold;
        }

        .rec-count {
            margin-left: auto;
            background: #fff3e0;
            color: #e65100;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #ffe0b2;
        }
        #network-container {
            flex: 1;
            background: #f8f9fa;
            position: relative;
        }

        #network-container::before {
            content: "LIVE GRAPH MODEL VIEWPORT";
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 1px;
            z-index: 5;
        }
    </style>
</head>

<body>

<div id="sidebar">
    <h2>LinkGraph</h2>
    <div class="sidebar-subtitle">Advanced Algorithms Platform</div>

    <div class="instruction-box" id="status-box">
        <strong>Live Demo Mode:</strong><br>Click any profile node in the network map to run live BFS recommendations and cluster community highlights.
    </div>

    <div id="analytics-panel" style="display:none;">
        <h3>Active Profile</h3>
        <div class="metric-card">
            <div id="user-name"></div>
            <div id="user-headline"></div>
            <div id="user-company"></div>
        </div>

        <h3>Detected Domain Skills</h3>
        <div id="user-skills"></div>

        <h3>Algorithmic Recommendations</h3>
        <div class="metric-card" style="border-left: 4px solid var(--rec-orange); background: #fffbf7;">
            <div id="rec-summary"></div>
        </div>
    </div>
</div>

<div id="network-container"></div>

<script>
let nodes, edges, network;
let nodesArray = [];
let edgesArray = [];
let connectionMap = {};

const clusterColors = {
    "AI & Data Intelligence": { background: '#ece0f2', border: '#7B2D8B' },
    "Cloud & Infrastructure": { background: '#e2f3eb', border: '#057642' },
    "Product Strategy & UX": { background: '#fcebe6', border: '#B24020' },
    "Talent & Corporate Growth": { background: '#e7f3ff', border: '#0A66C2' }
};

function getCommunity(skills) {
    if (skills.some(s => ["Machine Learning", "Data Science", "Python", "Graphs"].includes(s)))
        return "AI & Data Intelligence";
    if (skills.some(s => ["Cloud Architecture", "Backend Engineer", "Flask", "DevOps", "Cybersecurity"].includes(s)))
        return "Cloud & Infrastructure";
    if (skills.some(s => ["UX Research", "Product Design", "Design Systems"].includes(s)))
        return "Product Strategy & UX";
    return "Talent & Corporate Growth";
}

function buildGraph(users) {
    nodesArray = [];
    edgesArray = [];
    connectionMap = {};

    users.forEach(user => {
        const group = getCommunity(user.skills);
        connectionMap[user.id] = new Set(user.connections);

        nodesArray.push({
            id: user.id,
            label: user.name,
            title: user.headline,
            color: clusterColors[group],
            shape: 'dot',
            size: 20,
            font: { size: 13, face: 'Arial', color: '#2c3e50' },
            originalColor: clusterColors[group], 
            clusterGroup: group,
            userMeta: user
        });

        user.connections.forEach(conn => {
            if (user.id < conn) {
                edgesArray.push({
                    id: `base-${user.id}-${conn}`,
                    from: user.id,
                    to: conn,
                    color: { color: '#cbd5e1', highlight: '#0A66C2' },
                    width: 1.5,
                    isBase: true
                });
            }
        });
    });

    nodes = new vis.DataSet(nodesArray);
    edges = new vis.DataSet(edgesArray);

    network = new vis.Network(
        document.getElementById("network-container"),
        { nodes, edges },
        {
            physics: { 
                barnesHut: { 
                    gravity: -3800,
                    centralGravity: 0.15,
                    springLength: 140
                } 
            },
            interaction: { hover: true, selectConnectedEdges: false }
        }
    );

    network.on("selectNode", onSelectNode);
    network.on("deselectNode", onDeselectNode);
}

function onSelectNode(params) {
    const id = params.nodes[0];
    const clickedNode = nodes.get(id);
    const user = clickedNode.userMeta;

    document.getElementById("status-box").innerHTML = `<strong>Engine Running:</strong> Calculating 2nd-degree vector expansions for <strong>${user.name}</strong>.`;
    document.getElementById("analytics-panel").style.display = "block";
    document.getElementById("user-name").innerText = user.name;
    document.getElementById("user-headline").innerText = user.headline;
    document.getElementById("user-company").innerText = user.company;

    document.getElementById("user-skills").innerHTML =
        user.skills.map(s => `<span class="skill-tag">${s}</span>`).join("");

    const friends = connectionMap[id] || new Set();
    let recs = {};

    friends.forEach(f => {
        (connectionMap[f] || []).forEach(ff => {
            if (ff !== id && !friends.has(ff)) {
                recs[ff] = (recs[ff] || 0) + 1;
            }
        });
    });
    const currentEdges = edges.get();
    currentEdges.forEach(e => {
        if (!e.isBase) edges.remove(e.id);
    });

    let htmlContent = "";
    
    const updatedNodes = nodesArray.map(node => {
        if (node.id === id) {
            return { ...node, size: 30, color: node.originalColor };
        } else if (friends.has(node.id)) {
            return { ...node, size: 22, color: node.originalColor };
        } else if (recs[node.id]) {
            const mutualCount = recs[node.id];
            htmlContent += `
                <div class="rec-item">
                    <span class="rec-arrow">➜</span>
                    <strong>${node.label}</strong>
                    <span class="rec-count">${mutualCount} mutual</span>
                </div>`;

            edges.add({
                id: `rec-${id}-${node.id}`,
                from: id,
                to: node.id,
                color: { color: '#ff5722' },
                width: 2.5,
                dashes: [5, 5],
                label: 'Rec Link',
                font: { size: 11, color: '#ff5722', align: 'top', strokeWidth: 0 },
                isBase: false
            });

            return { ...node, size: 24, color: { background: '#ffe0b2', border: '#ff5722' } };
        } else {
            return { ...node, size: 14, color: { background: '#f5f5f5', border: '#e2e8f0' }, font: { color: '#94a3b8' } };
        }
    });

    nodes.update(updatedNodes);
    document.getElementById("rec-summary").innerHTML =
        htmlContent || "<span style='color: var(--text-muted); font-style: italic;'>No 2nd-degree recommendations available.</span>";
        
    network.focus(id, { scale: 0.95, animation: { duration: 400, easingFunction: "easeInOutQuad" } });
}
function onDeselectNode() {
    document.getElementById("status-box").innerHTML = `<strong>Live Demo Mode:</strong><br>Click any profile node in the network map to run live BFS recommendations and cluster community highlights.`;
    document.getElementById("analytics-panel").style.display = "none";

    const currentEdges = edges.get();
    currentEdges.forEach(e => {
        if (!e.isBase) edges.remove(e.id);
    });
    nodes.update(nodesArray.map(n => ({
        ...n,
        size: 20,
        color: n.originalColor,
        font: { size: 13, face: 'Arial', color: '#2c3e50' }
    })));
}

fetch("dataset.json")
    .then(res => res.json())
    .then(data => {
        buildGraph(data.users);
    });
</script>

</body>
</html>
